name: zenmoney-backup

services:
  zenmoney-backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: local/zenmoney-backup:latest
    container_name: zenmoney-backup
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      # Set BACKUP_HOST_DIR in .env to a folder on the NAS HDD pool.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
